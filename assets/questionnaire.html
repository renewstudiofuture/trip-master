<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip Master · 从这里出发</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#171717;font:16px/1.6 "PingFang SC","Microsoft YaHei",sans-serif}main{max-width:680px;margin:auto;padding:24px 20px 50px}header{border-bottom:2px solid;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.12em}.shape{color:#d73527}h1{font-size:42px;line-height:1.15;letter-spacing:-.05em;margin:28px 0 12px}h1 span{background:#f2ce35}p{font-size:14px;color:#555}label,legend{font-weight:600;font-size:14px}input,select,textarea,button{font:inherit;color:inherit}input,select,textarea{width:100%;min-height:46px;padding:10px;border:1px solid #999;background:white;border-radius:0}label{display:block;margin:12px 0}small{display:block;font-weight:400;color:#555}fieldset{border:0;padding:0;margin:18px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chips label{margin:0;cursor:pointer}.chips input{width:auto;min-height:0;margin-right:6px}.chips label{padding:8px 12px;border:1px solid}.chips label:has(input:checked){background:#f2ce35}button{min-height:46px;padding:10px 16px;border:1px solid #171717;background:white;cursor:pointer}.primary{background:#164bb8;color:white;border-color:#164bb8}.actions{display:flex;gap:10px;flex-wrap:wrap}textarea{min-height:160px}#status{background:#f2ce35;padding:10px}#status:empty{display:none}[hidden]{display:none!important}:focus-visible{outline:3px solid #164bb8;outline-offset:3px}@media(max-width:380px){.row{grid-template-columns:1fr}h1{font-size:36px}}
</style></head><body><main><header><b>TRIP MASTER</b><span class="shape" aria-hidden="true">● ■ ▲</span></header><h1>下一站，<br><span>由你决定。</span></h1><p>五项就够了。拿不准的留空，已有安排可以直接告诉 Agent。</p><form id="intake"><div class="row"><label>目的地<input name="destination" placeholder="例如：成都、九寨沟" required maxlength="100"></label><label>出发地<input name="origin" placeholder="例如：上海" maxlength="100"></label></div><fieldset><legend>日期 <small>未定可留空；不自动猜测年份。</small></legend><div class="row"><label>出发<input name="start_date" type="date"></label><label>结束<input name="end_date" type="date"></label></div></fieldset><fieldset><legend>预算 <small>可跳过；金额范围不清时先按偏好出草案。</small></legend><div class="row"><label>金额<input name="budget" inputmode="decimal" placeholder="例如：6000"></label><label>范围<select name="budget_scope"><option value="total">全程总预算</option><option value="per_person">每人预算</option></select></label></div><label>币种<select name="currency"><option>CNY</option><option>USD</option><option>EUR</option><option>JPY</option><option>KRW</option><option>THB</option><option>HKD</option><option>SGD</option></select></label></fieldset><fieldset><legend>偏好 <small>点选即可，也可以不选。</small></legend><div class="chips"><label><input type="checkbox" name="preference" value="慢游">慢游</label><label><input type="checkbox" name="preference" value="自然">自然</label><label><input type="checkbox" name="preference" value="人文">人文</label><label><input type="checkbox" name="preference" value="美食">美食</label><label><input type="checkbox" name="preference" value="购物">购物</label><label><input type="checkbox" name="preference" value="亲子">亲子</label></div><input name="note" aria-label="补充一句偏好" maxlength="300" placeholder="可补一句：不早起、带长辈、必去地点……"></fieldset><div class="actions"><button class="primary">整理需求</button><button type="button" id="reset">清空草稿</button></div></form><p id="status" role="status"></p><section id="result" hidden><label>复制给 Agent<textarea id="brief" readonly></textarea></label><div class="actions"><button id="copy">复制需求</button><button id="export">下载需求</button></div><p>问卷不会自动发送，也不会登录旅行平台。</p></section></main><script id="prefill" type="application/json">{}</script><script>
(()=>{'use strict';const f=document.getElementById('intake'),$=id=>document.getElementById(id),key='trip-master:intake:v2';let brief={};const read=()=>{const d=new FormData(f);return{destination:d.get('destination').trim(),origin:d.get('origin').trim(),start_date:d.get('start_date')||null,end_date:d.get('end_date')||null,budget:d.get('budget').trim(),budget_scope:d.get('budget_scope'),currency:d.get('currency'),preferences:d.getAll('preference'),note:d.get('note').trim()}};function fill(x){for(const k of ['destination','origin','start_date','end_date','budget','budget_scope','currency','note'])if(x[k]!=null&&f.elements[k])f.elements[k].value=String(x[k]);if(Array.isArray(x.preferences))f.querySelectorAll('[name=preference]').forEach(el=>el.checked=x.preferences.includes(el.value))}try{fill(JSON.parse(localStorage.getItem(key)||'{}'))}catch(e){$('status').textContent='无法读取本机草稿，仍可填写并复制。'}try{fill(JSON.parse($('prefill').textContent))}catch(e){}f.oninput=()=>{try{localStorage.setItem(key,JSON.stringify(read()))}catch(e){$('status').textContent='草稿未保存，请完成后复制需求。'}};f.onsubmit=e=>{e.preventDefault();brief=read();if(brief.start_date&&brief.end_date&&brief.end_date<brief.start_date){$('status').textContent='结束日期不能早于出发日期。';return}const decimal=['JPY','KRW'].includes(brief.currency)?/^\d+$/:/^\d+(?:\.\d{1,2})?$/;if(brief.budget&&!decimal.test(brief.budget)){$('status').textContent='请输入有效预算金额，或留空。';return}$('brief').value='请使用 Trip Master，先给简洁的每日骨架；交通住宿由我提供，未提供保持待确认。\n'+JSON.stringify(brief,null,2);$('result').hidden=false;$('status').textContent='需求已整理，复制给 Agent 即可。'};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('brief').value);$('status').textContent='已复制'}catch(e){$('brief').focus();$('brief').select();$('status').textContent='请手动复制已选文字。'}};$('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(brief,null,2)],{type:'application/json'}));a.href=u;a.download='trip-brief.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('reset').onclick=()=>{f.reset();$('result').hidden=true;try{localStorage.removeItem(key);$('status').textContent='草稿已清空'}catch(e){$('status').textContent='表单已清空；浏览器草稿无法删除。'}}})();
</script></body></html>
