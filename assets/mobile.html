<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><title>__TITLE__</title>
<style>
:root{--paper:#f7f6f2;--ink:#171717;--red:#d73527;--blue:#164bb8;--yellow:#f2ce35;--line:#cccac4;--muted:#55544e}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}a{color:inherit}button{font:inherit}button,a,summary{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:4px}[hidden]{display:none!important}.wrap{max-width:760px;margin:auto;padding:0 24px 110px}.mast{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:2px solid;padding:20px 0;font-size:12px;font-weight:700;letter-spacing:.1em}.logo{display:flex;gap:5px;align-items:center}.logo i{display:block;width:12px;height:12px;background:var(--red);border-radius:50%}.logo i:nth-child(2){border-radius:0;background:var(--blue)}.logo i:nth-child(3){border-radius:0;background:var(--yellow);clip-path:polygon(50% 0,100% 100%,0 100%)}.hero{padding:32px 0 24px;position:relative}.eyebrow{font-size:12px;color:var(--muted);margin:0 0 12px}.hero h1{font-size:clamp(38px,8vw,62px);font-weight:900;line-height:1.2;letter-spacing:-.05em;margin:0;max-width:80%}.hero .sub{font-size:14px;max-width:80%;margin:16px 0 0}.composition{height:120px;display:grid;grid-template-columns:1.3fr 1fr 1fr;margin-top:28px;border:2px solid var(--ink);overflow:hidden}.composition .red{background:var(--red);position:relative}.composition .red:after{content:"";position:absolute;bottom:0;left:0;width:100%;height:50%;background:var(--ink)}.composition .circle{background:var(--yellow);border-left:2px solid;border-right:2px solid;display:flex;align-items:center;justify-content:center}.composition .circle:after{content:"";background:var(--paper);border:2px solid;border-radius:50%;height:88px;width:88px}.composition .blue{background:var(--blue);border-radius:100% 0 0 0}.datebar{display:flex;gap:0;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 0;border-bottom:2px solid var(--ink);scrollbar-width:thin}.datebar a{flex:1 0 47px;text-decoration:none;min-height:48px;display:grid;place-items:center;font-family:"Arial Black",sans-serif;font-size:17px;border-right:1px solid var(--line)}.datebar a:first-child{font-size:12px;flex-basis:49px}.datebar a.active{background:var(--ink);color:white}.panel{padding-top:28px;scroll-margin-top:78px}.panel-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:24px}.day-number{flex:none;background:var(--yellow);font-family:"Arial Black",sans-serif;font-size:48px;line-height:1;width:84px;height:92px;display:grid;place-items:center;border-bottom:9px solid var(--ink)}.panel h2{font-size:28px;line-height:1.25;margin:0 0 12px;letter-spacing:-.035em}.panel .route{margin:0;font-size:13px;color:var(--muted)}.panel .kicker{color:var(--blue);font-size:12px;font-weight:700;margin:0 0 8px}.overview-list{list-style:none;padding:0;margin:0}.overview-list a{display:grid;grid-template-columns:52px 1fr 26px;gap:12px;align-items:center;min-height:80px;text-decoration:none;border-top:1px solid var(--ink);padding:14px 0}.overview-list .n{font-family:"Arial Black",sans-serif;font-size:28px;line-height:1}.overview-list .name{font-size:17px;font-weight:700}.overview-list .arrow{font-size:23px;color:var(--blue)}.overview-list a:hover{background:#eeece5}.legend{font-size:12px;margin:20px 0;color:var(--muted)}.action-row{display:flex;justify-content:space-between;align-items:center;margin:12px 0 22px;font-size:12px;color:var(--muted)}.action-row button{background:transparent;border:1px solid var(--ink);padding:8px 12px;min-height:44px;color:var(--ink)}.stops{border-left:2px solid var(--ink);margin:0 0 0 9px;padding:0 0 0 24px}.stop{position:relative;margin:0 0 22px;background:white;border:1px solid var(--ink)}.stop:before{content:"";position:absolute;width:14px;height:14px;left:-33px;top:23px;background:var(--blue);border:2px solid var(--paper)}.stop.hotel:before{background:var(--red);border-radius:50%}.stop.warn:before{background:var(--yellow);border:2px solid var(--ink)}.stop summary{cursor:pointer;list-style:none;padding:18px 42px 18px 18px;position:relative;min-height:60px}.stop summary::-webkit-details-marker{display:none}.stop summary:after{content:"+";position:absolute;right:16px;top:23px;font:24px/1 Arial}.stop[open] summary:after{content:"−"}.label{display:block;font-size:11px;font-weight:600;color:var(--blue);margin-bottom:8px}.hotel .label{color:#a4271d}.warn .label{background:var(--yellow);color:var(--ink);padding:3px 6px;display:inline-block}.stop h3{font-size:18px;line-height:1.5;margin:0;font-weight:700}.stop .body{font-size:14px;line-height:1.8;white-space:pre-line;padding:0 18px 18px;margin:0;color:#45443e}.source-link{display:block;padding:12px 18px;font-size:12px;border-top:1px solid var(--line);color:var(--blue);min-height:44px}.note{font-size:13px;color:var(--muted);border-left:5px solid var(--yellow);padding:10px 0 10px 14px;white-space:pre-line;margin:26px 0}.footnote{margin:36px 0 0;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:8;background:var(--ink);color:white;padding-bottom:env(safe-area-inset-bottom)}.bottom .inner{display:flex;max-width:760px;margin:auto}.bottom a{flex:1;min-height:60px;display:grid;place-items:center;font-size:13px;text-decoration:none;border-top:4px solid transparent}.bottom a.active{border-color:var(--yellow);color:var(--yellow)}.link-row{display:flex;gap:20px;flex-wrap:wrap;margin-top:24px;font-size:13px}.link-row a{min-height:44px;display:flex;align-items:center;text-underline-offset:4px}.notice{font-size:12px;color:var(--muted);margin:20px 0}.nojs{padding:12px;background:var(--yellow)}@media(min-width:680px){.hero{display:grid;grid-template-columns:1fr 180px;column-gap:30px}.hero h1{max-width:none}.hero .composition{grid-column:2;grid-row:1/5;height:180px;margin:0;grid-template-columns:1fr 1fr}.composition .red{grid-row:1/3}.composition .circle{border-right:0;border-bottom:2px solid}.composition .circle:after{width:65px;height:65px}.hero .sub{max-width:none}.stops{max-width:640px}.panel{padding-top:36px}}@media(max-width:360px){.wrap{padding-left:16px;padding-right:16px}.hero h1{font-size:37px}.panel h2{font-size:24px}.day-number{width:65px;height:80px;font-size:40px}.stops{padding-left:19px}.stop:before{left:-28px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}@media print{.panel[hidden]{display:block!important}.datebar,.bottom,.action-row{display:none}.wrap{max-width:none;padding:0}.panel{break-before:page}.hero{break-after:page}.stop{break-inside:avoid}.composition{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body><div class="wrap"><header class="mast"><span>旅行随身册</span><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span></header><div class="hero"><p class="eyebrow">__META__</p><h1>__TITLE__</h1><p class="sub">__INTRO__</p><div class="composition" aria-hidden="true"><div class="red"></div><div class="circle"></div><div class="blue"></div></div></div><nav class="datebar" aria-label="按日期查看">__DATES__</nav><noscript><p class="nojs">当前未启用脚本，所有日程已展开，日期链接仍可定位。</p></noscript><main>__PANELS__</main><footer class="footnote">__STATUS__<div class="link-row"><a href="#sources">信息来源</a><a href="#overview">返回总览 ↑</a></div></footer></div><nav class="bottom" aria-label="主要栏目"><div class="inner"><a href="#overview" data-group="trip">行程</a><a href="#stay" data-group="stay">住宿</a><a href="#budget" data-group="budget">预算</a><a href="#todo" data-group="todo">待办</a></div></nav>
<script>
(function(){'use strict';var panels=Array.from(document.querySelectorAll('.panel'));var dateLinks=Array.from(document.querySelectorAll('.datebar a'));function route(){var id;try{id=decodeURIComponent(location.hash.slice(1)||'overview')}catch(e){id='overview'}if(!panels.some(function(p){return p.id===id}))id='overview';document.querySelector('.hero').hidden=id!=='overview';panels.forEach(function(p){p.hidden=p.id!==id});dateLinks.forEach(function(a){var selected=a.hash==='#'+id;a.classList.toggle('active',selected);if(selected)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.querySelectorAll('.bottom a').forEach(function(a){var selected=a.hash==='#'+id||(a.dataset.group==='trip'&&id.indexOf('day')===0);a.classList.toggle('active',selected);if(selected)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(location.hash){var el=document.getElementById(id);window.scrollTo(0,el.offsetTop-78)}}window.addEventListener('hashchange',route);route();document.querySelectorAll('[data-toggle]').forEach(function(b){b.addEventListener('click',function(){var list=Array.from(b.closest('.panel').querySelectorAll('details'));var expand=list.some(function(d){return !d.open});list.forEach(function(d){d.open=expand});b.textContent=expand?'收起详情':'展开详情'})});window.addEventListener('beforeprint',function(){document.querySelectorAll('details').forEach(function(d){d.dataset.previousOpen=d.open?'1':'0';d.open=true})});window.addEventListener('afterprint',function(){document.querySelectorAll('details').forEach(function(d){d.open=d.dataset.previousOpen==='1'})});})();
</script></body></html>
