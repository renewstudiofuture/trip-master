<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>__TITLE__</title><style>__CSS__</style></head><body>
<div class="wrap"><header class="mast"><b>TRIP MASTER</b><span class="shapes" aria-hidden="true">● ■ ▲</span></header><header class="hero"><p class="tag">__META__</p>__COVER_TITLE__</header>
__HERO_IMAGE__
<nav class="navigation" aria-label="攻略栏目"><a href="#itinerary">行程</a><a href="#sights">景点</a><a href="#shopping">购物</a><a href="#food">餐饮</a><a href="#tips">贴士</a></nav>

<noscript><p class="notice">所有行程可直接阅读；记账、待办保存和修改申请需要启用 JavaScript。</p></noscript><main>__BODY__</main>
<p id="status" role="status" aria-live="polite"></p><section id="fallback" hidden><label>可手动复制<textarea readonly id="copy-fallback"></textarea></label></section>
<section class="tool" id="ledger" hidden><h2>记一笔</h2><p class="notice">只保存在当前浏览器。分享攻略不会共享账本；定期导出备份。</p><div id="totals" aria-live="polite"></div><form id="expense-form"><input type="hidden" id="expense-id"><div class="formgrid"><label>金额<input id="amount" inputmode="decimal" required autocomplete="off" placeholder="0.00"></label><label>币种<select id="currency"></select></label><label>分类<select id="category"><option>餐饮</option><option>交通</option><option>住宿</option><option>门票</option><option>购物</option><option>其他</option></select></label><label>日期<input type="date" id="expense-date" required></label></div><details class="expense-more"><summary>备注（可选）</summary><label>备注<input id="expense-note" maxlength="120"></label></details><div class="actions"><button type="submit" class="primary">保存账目</button><button type="button" id="cancel-edit">取消编辑</button></div></form><div id="entries"></div><div class="actions"><button id="export-state">导出备份</button><label class="filebutton">导入备份<input id="import-state" type="file" accept="application/json,.json"></label></div></section>
<section class="tool" id="change" hidden><h2>调整我的行程</h2><p class="notice">保存后立即更新本页，仅保存在当前浏览器。公共分享链接保持原版；跨天调整不会自动核验车程和预约。</p><p id="plan-status" role="status"></p><form id="change-form"><label>哪一天<select id="change-day"></select></label><div class="formgrid"><label>操作<select id="change-type"><option value="edit">修改活动</option><option value="add">新增活动</option><option value="remove">删除活动</option><option value="move">移到另一天</option></select></label><label id="stop-label">活动<select id="change-stop"></select></label><label id="target-label">移到<select id="target-day"></select></label></div><label id="name-label">活动名称<input id="change-name" maxlength="100"></label><label id="time-label">建议时段<input id="change-time" maxlength="100" placeholder="例如：10:00–12:00 · 建议"></label><label id="note-label">游玩说明<textarea id="change-note" maxlength="500"></textarea></label><button class="primary">保存到我的行程</button></form><div id="plan-order"></div><div class="actions"><button id="export-plan">导出个人行程</button><label class="filebutton">导入个人行程<input id="import-plan" type="file" accept="application/json,.json"></label><button id="reset-plan">恢复原版</button></div><details><summary>需要助手重新规划？</summary><p>写下要求，复制后回到生成攻略的聊天发送。这里不会自动调用助手。</p><label>重新规划要求<textarea id="assistant-note" maxlength="1000" placeholder="例如：第4天少走路，帮我调整游玩顺序"></textarea></label><button id="copy-request">复制给助手</button></details></section>
<footer>外部导航、来源与远程图片需要联网。规划信息以来源和标注日期为准。</footer></div>
<button id="return-to-route" class="return-to-route" hidden>↩ 返回刚才行程</button><div id="theme-status" role="status" aria-live="polite"></div><div class="toolbar" hidden><button data-tool="ledger">记账</button><button data-tool="change">调整</button><button id="share">分享</button><button id="theme-toggle" aria-label="换皮肤，当前包豪斯" aria-pressed="false">换皮肤</button></div><script id="trip-data" type="application/json">__DATA__</script><script>__JS__</script></body></html>
